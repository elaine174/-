<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏆 得獎結果</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans TC','sans-serif']}}}}</script>
  <style>
    body{background:#FFF8F0;}
    @keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
    .confetti{position:fixed;top:-30px;animation:fall linear infinite;pointer-events:none;z-index:50;}
  </style>
</head>
<body class="min-h-screen font-sans">
  <div class="max-w-lg mx-auto px-4 py-6">
    <div class="flex items-center gap-3 mb-6">
      <a href="/" class="text-2xl text-gray-400">←</a>
      <h1 class="text-xl font-black text-gray-800">🏆 得獎結果</h1>
    </div>
    <div id="loading" class="text-center py-16 text-gray-400">載入中...</div>
    <div id="locked" class="hidden text-center py-16">
      <div class="text-7xl mb-4">🔒</div>
      <h2 class="text-2xl font-black text-gray-700">結果尚未揭曉</h2>
      <p class="text-gray-400 mt-2">評審選完後，主辦人將公布得獎者！</p>
    </div>
    <div id="results" class="hidden space-y-6"></div>
  </div>
  <script>
    async function load() {
      const { awards, revealed } = await (await fetch('/api/awards')).json();
      document.getElementById('loading').classList.add('hidden');
      if (!revealed) { document.getElementById('locked').classList.remove('hidden'); return; }
      startConfetti();
      const c = document.getElementById('results');
      c.classList.remove('hidden');
      c.innerHTML = `
        <div class="text-center mb-2">
          <div class="text-5xl mb-2">🎊</div>
          <h2 class="text-2xl font-black text-gray-800">得獎名單揭曉！</h2>
        </div>
        ${awards.map(a => `
          <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="bg-indigo-600 px-5 py-3">
              <div class="font-black text-white text-lg">${a.name}</div>
              <div class="text-indigo-200 text-sm">評選：${a.judge_name}</div>
            </div>
            ${a.winner_photo_id ? `
              <img src="/uploads/${a.winner_filename}" class="w-full max-h-72 object-contain bg-gray-100">
              <div class="p-4 text-center">
                <div class="font-black text-2xl text-gray-800">${a.winner_name}</div>
                <div class="text-gray-400 text-sm">參賽者 #${a.winner_display_id}</div>
              </div>
            ` : `<div class="p-6 text-center text-gray-400">評審尚未選定</div>`}
          </div>
        `).join('')}
      `;
    }
    function startConfetti() {
      ['🐒','🦁','🐘','🦒','🐯','🎉','⭐','🏆'].forEach((e,i) => {
        const el = document.createElement('div');
        el.className = 'confetti'; el.textContent = e;
        el.style.cssText = `left:${Math.random()*95}vw;font-size:${Math.random()*20+15}px;animation-duration:${Math.random()*3+2}s;animation-delay:${i*0.3}s`;
        document.body.appendChild(el);
      });
    }
    load();
  </script>
</body>
</html>
