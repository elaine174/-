<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏆 投票結果</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans TC','sans-serif']}}}}</script>
  <style>
    body{background:#FFF8F0;}
    @keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
    .confetti{position:fixed;top:-30px;animation:fall linear infinite;pointer-events:none;z-index:50;}
  </style>
</head>
<body class="min-h-screen font-sans">
  <div class="max-w-lg mx-auto px-4 py-6">
    <div class="flex items-center gap-3 mb-6">
      <a href="/" class="text-2xl text-gray-400">←</a>
      <h1 class="text-xl font-black text-gray-800">🏆 投票結果</h1>
    </div>
    <div id="loading" class="text-center py-16 text-gray-400">載入中...</div>
    <div id="locked" class="hidden text-center py-16">
      <div class="text-7xl mb-4">🔒</div>
      <h2 class="text-2xl font-black text-gray-700">結果尚未揭曉</h2>
      <p class="text-gray-400 mt-2">等待投票結束後，主辦人將公布結果！</p>
      <p class="text-sm text-gray-400 mt-1" id="vote-hint"></p>
    </div>
    <div id="results" class="hidden space-y-4"></div>
  </div>
  <script>
    const medals=['🥇','🥈','🥉'];
    async function load(){
      const [s,p]=await Promise.all([fetch('/api/status'),fetch('/api/photos')]);
      const status=await s.json(), {photos,revealed}=await p.json();
      document.getElementById('loading').classList.add('hidden');
      if(!revealed){
        document.getElementById('locked').classList.remove('hidden');
        if(status.vote_count>0)document.getElementById('vote-hint').textContent=`目前已有 ${status.vote_count} 人投票`;
        return;
      }
      startConfetti();
      const total=photos.reduce((s,p)=>s+p.votes,0);
      const c=document.getElementById('results');
      c.classList.remove('hidden');
      c.innerHTML=`
        <div class="text-center mb-4">
          <div class="text-5xl mb-2">🎊</div>
          <h2 class="text-2xl font-black text-gray-800">結果揭曉！</h2>
          <p class="text-gray-400 text-sm mt-1">共 ${total} 票 · ${photos.length} 件作品</p>
        </div>
        ${photos.map((p,i)=>`
          <div class="bg-white rounded-2xl shadow-sm overflow-hidden ${i===0?'ring-2 ring-yellow-400':''}">
            <div class="relative">
              <img src="/uploads/${p.filename}" class="w-full max-h-72 object-contain bg-gray-100">
              <div class="absolute top-3 left-3 bg-white bg-opacity-90 rounded-xl px-3 py-1 font-black text-2xl">${medals[i]||`#${i+1}`}</div>
            </div>
            <div class="p-4 flex items-center justify-between">
              <div><div class="font-black text-lg text-gray-800">${p.name}</div><div class="text-xs text-gray-400">參賽者 #${p.display_id}</div></div>
              <div class="text-right"><div class="font-black text-2xl text-orange-500">${p.votes}</div><div class="text-xs text-gray-400">票</div></div>
            </div>
            ${total>0?`<div class="px-4 pb-4"><div class="bg-gray-100 rounded-full h-2"><div class="bg-orange-400 h-2 rounded-full" style="width:${Math.round(p.votes/total*100)}%"></div></div><div class="text-xs text-gray-400 mt-1 text-right">${Math.round(p.votes/total*100)}%</div></div>`:''}
          </div>
        `).join('')}
      `;
    }
    function startConfetti(){
      ['🐒','🦁','🐘','🦒','🐯','🎉','⭐','🏆'].forEach((e,i)=>{
        const el=document.createElement('div');
        el.className='confetti'; el.textContent=e;
        el.style.cssText=`left:${Math.random()*95}vw;font-size:${Math.random()*20+15}px;animation-duration:${Math.random()*3+2}s;animation-delay:${i*0.3}s`;
        document.body.appendChild(el);
      });
    }
    load();
  </script>
</body>
</html>
