<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔧 管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans TC','sans-serif']}}}}</script>
  <style>body{background:#FFF8F0;}</style>
</head>
<body class="min-h-screen font-sans">
  <div class="max-w-lg mx-auto px-4 py-6">
    <div class="flex items-center gap-3 mb-6">
      <a href="/" class="text-2xl text-gray-400">←</a>
      <h1 class="text-xl font-black text-gray-800">🔧 管理後台</h1>
    </div>
    <div id="login" class="bg-white rounded-2xl p-6 shadow-sm">
      <h2 class="font-bold text-gray-700 mb-4">管理員密碼</h2>
      <input type="password" id="pw" placeholder="密碼" class="w-full px-4 py-3 border border-gray-200 rounded-xl mb-3 text-base focus:outline-none">
      <button onclick="login()" class="w-full py-3 bg-gray-800 text-white rounded-xl font-bold">登入</button>
      <div id="err" class="hidden mt-2 text-red-500 text-sm text-center"></div>
    </div>
    <div id="dash" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <h2 class="font-bold text-gray-700 mb-3">📊 統計</h2>
        <div class="grid grid-cols-2 gap-3 text-center">
          <div class="bg-orange-50 rounded-xl p-3"><div class="font-black text-2xl text-orange-500" id="s-photos">-</div><div class="text-xs text-gray-400">投稿數</div></div>
          <div class="bg-blue-50 rounded-xl p-3"><div class="font-black text-xl" id="s-status">-</div><div class="text-xs text-gray-400">狀態</div></div>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm space-y-3">
        <h2 class="font-bold text-gray-700">⚙️ 結果控制</h2>
        <button onclick="reveal()" class="w-full py-3 bg-yellow-500 text-white rounded-xl font-bold">🏆 公布得獎結果</button>
        <button onclick="hideRes()" class="w-full py-3 bg-gray-500 text-white rounded-xl font-bold">🔒 隱藏結果</button>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <h2 class="font-bold text-gray-700 mb-3">🏅 獎項管理</h2>
        <div id="awards-list" class="space-y-2 mb-4"></div>
        <div class="border-t pt-3 space-y-2">
          <input id="new-award" placeholder="獎項名稱（如：最佳厭世獎）" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm">
          <input id="new-judge" placeholder="評審姓名" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm">
          <button onclick="addAward()" class="w-full py-2 bg-indigo-600 text-white rounded-xl font-bold text-sm">+ 新增獎項</button>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <h2 class="font-bold text-gray-700 mb-3">📋 投稿列表（含姓名）</h2>
        <div id="sub-list" class="space-y-2"></div>
      </div>
      <div class="bg-red-50 border border-red-200 rounded-2xl p-5">
        <button onclick="resetAll()" class="w-full py-3 bg-red-500 text-white rounded-xl font-bold">🗑️ 清除所有資料</button>
      </div>
    </div>
  </div>
  <script>
    let pw = '';
    async function login() {
      pw = document.getElementById('pw').value;
      const res = await fetch('/api/admin/submissions?password=' + encodeURIComponent(pw));
      if (!res.ok) { document.getElementById('err').textContent='密碼錯誤'; document.getElementById('err').classList.remove('hidden'); return; }
      document.getElementById('login').classList.add('hidden');
      document.getElementById('dash').classList.remove('hidden');
      loadDash();
    }
    document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
    async function loadDash() {
      const [s, ar, sr] = await Promise.all([
        fetch('/api/status').then(r=>r.json()),
        fetch('/api/awards').then(r=>r.json()),
        fetch('/api/admin/submissions?password='+encodeURIComponent(pw)).then(r=>r.json())
      ]);
      document.getElementById('s-photos').textContent = s.photo_count;
      document.getElementById('s-status').textContent = s.revealed ? '🏆已揭曉' : '🔒未揭曉';
      document.getElementById('awards-list').innerHTML = ar.awards.map(a => `
        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
          <div><div class="font-bold text-sm text-gray-800">${a.name}</div><div class="text-xs text-gray-400">${a.judge_name} · ${a.winner_photo_id?'已選定 #'+a.winner_display_id:'尚未選定'}</div></div>
          <button onclick="delAward('${a.id}')" class="text-red-400 text-sm px-2">✕</button>
        </div>
      `).join('');
      document.getElementById('sub-list').innerHTML = sr.photos.length ? sr.photos.map(p=>`
        <div class="flex items-center gap-3 p-2 bg-gray-50 rounded-xl">
          <img src="/uploads/${p.filename}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0">
          <div><div class="font-bold text-sm text-gray-800">${p.name}</div><div class="text-xs text-gray-400">#${p.display_id}</div></div>
        </div>
      `).join('') : '<p class="text-gray-400 text-sm">目前沒有投稿</p>';
    }
    async function post(url, body={}) {
      const res = await fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,...body})});
      return res.json();
    }
    async function reveal(){if(!confirm('確定公布結果？'))return;const d=await post('/api/admin/reveal');if(d.error){alert(d.error);return;}alert('🏆 結果已公布！');loadDash();}
    async function hideRes(){if(!confirm('確定隱藏結果？'))return;const d=await post('/api/admin/hide');if(d.error){alert(d.error);return;}alert('已隱藏');loadDash();}
    async function addAward(){
      const name=document.getElementById('new-award').value.trim();
      const judge_name=document.getElementById('new-judge').value.trim();
      if(!name||!judge_name){alert('請填寫獎項名稱和評審姓名');return;}
      const d=await post('/api/admin/award/add',{name,judge_name});
      if(d.error){alert(d.error);return;}
      document.getElementById('new-award').value='';
      document.getElementById('new-judge').value='';
      loadDash();
    }
    async function delAward(id){if(!confirm('確定刪除此獎項？'))return;await post('/api/admin/award/delete',{award_id:id});loadDash();}
    async function resetAll(){if(!confirm('⚠️ 確定清除所有資料？'))return;if(!confirm('再次確認，無法復原！'))return;const d=await post('/api/admin/reset');if(d.error){alert(d.error);return;}alert('已重置');loadDash();}
  </script>
</body>
</html>
