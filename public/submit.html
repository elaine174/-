<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 投稿照片</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans TC','sans-serif']}}}}</script>
  <style>body{background:#FFF8F0;}</style>
</head>
<body class="min-h-screen font-sans">
  <div class="max-w-lg mx-auto px-4 py-6">
    <div class="flex items-center gap-3 mb-6">
      <a href="/" class="text-2xl text-gray-400">←</a>
      <h1 class="text-xl font-black text-gray-800">📸 投稿照片</h1>
    </div>
    <div id="success" class="hidden bg-green-50 border border-green-200 rounded-2xl p-6 text-center mb-6">
      <div class="text-5xl mb-3">🎉</div>
      <h2 class="text-xl font-black text-green-700">投稿成功！</h2>
      <p class="text-green-600 mt-1 text-sm" id="success-detail"></p>
      <div class="mt-4 flex gap-3 justify-center">
        <button onclick="reset()" class="px-4 py-2 bg-green-600 text-white rounded-xl font-bold text-sm">再投一張</button>
        <a href="/" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl font-bold text-sm">回首頁</a>
      </div>
    </div>
    <form id="form" class="space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <label class="block text-sm font-bold text-gray-700 mb-2">你的姓名 *</label>
        <input type="text" id="name" name="name" required placeholder="請輸入真實姓名"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-base focus:outline-none focus:border-orange-400">
        <p class="text-xs text-gray-400 mt-2">⚠️ 投票結束前，大家不會看到你的名字</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <label class="block text-sm font-bold text-gray-700 mb-2">上傳動物迷因照 *</label>
        <div id="drop" onclick="document.getElementById('photo').click()"
          class="border-2 border-dashed border-gray-200 rounded-xl p-8 text-center cursor-pointer hover:border-orange-400 transition-colors">
          <div class="text-4xl mb-2">🖼️</div>
          <div class="text-gray-500 text-sm">點擊選擇照片</div>
          <div class="text-gray-400 text-xs mt-1">JPG / PNG · 最大 30MB</div>
        </div>
        <input type="file" id="photo" name="photo" accept="image/*" class="hidden" onchange="preview(this)">
        <div id="prev-wrap" class="hidden mt-3">
          <img id="prev-img" class="w-full rounded-xl max-h-72 object-contain bg-gray-100">
          <button type="button" onclick="clearPhoto()" class="mt-2 text-xs text-red-400">✕ 移除照片</button>
        </div>
      </div>
      <div id="err" class="hidden bg-red-50 border border-red-200 rounded-xl p-3 text-red-600 text-sm"></div>
      <button type="submit" id="btn"
        class="w-full py-4 bg-orange-500 text-white rounded-2xl font-black text-lg shadow-md active:scale-95 transition-transform">
        🐾 送出投稿
      </button>
    </form>
  </div>
  <script>
    function preview(input){
      const file=input.files[0]; if(!file)return;
      const reader=new FileReader();
      reader.onload=e=>{
        document.getElementById('prev-img').src=e.target.result;
        document.getElementById('prev-wrap').classList.remove('hidden');
        document.getElementById('drop').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }
    function clearPhoto(){
      document.getElementById('photo').value='';
      document.getElementById('prev-wrap').classList.add('hidden');
      document.getElementById('drop').classList.remove('hidden');
    }
    function reset(){
      document.getElementById('form').reset();
      clearPhoto();
      document.getElementById('success').classList.add('hidden');
      document.getElementById('form').classList.remove('hidden');
    }
    document.getElementById('form').addEventListener('submit',async e=>{
      e.preventDefault();
      const btn=document.getElementById('btn'), errDiv=document.getElementById('err');
      btn.disabled=true; btn.textContent='上傳中...'; errDiv.classList.add('hidden');
      try{
        const res=await fetch('/api/submit',{method:'POST',body:new FormData(e.target)});
        const data=await res.json();
        if(!res.ok)throw new Error(data.error);
        document.getElementById('success-detail').textContent=`你的照片是第 #${data.display_id} 號參賽作品！`;
        document.getElementById('form').classList.add('hidden');
        document.getElementById('success').classList.remove('hidden');
      }catch(err){
        errDiv.textContent='❌ '+err.message;
        errDiv.classList.remove('hidden');
      }finally{
        btn.disabled=false; btn.textContent='🐾 送出投稿';
      }
    });
  </script>
</body>
</html>
